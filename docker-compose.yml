services:
  mysql:
    image: mysql:8.4
    container_name: system-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tce-system
      MYSQL_ROOT_PASSWORD: tce1234
    ports:
      - "5000:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: system-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: mysql://root:tce1234@mysql:3306/tce-system
    ports:
      - "4000:4000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    container_name: system-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
